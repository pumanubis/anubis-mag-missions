<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a15"><link rel="manifest" href="manifest.webmanifest"><title>ANUBIS MAG MISSIONS V1.0</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eadf;background:#101a15}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #5c765e;border-radius:10px;padding:11px 14px;background:#284a34;color:#f4efd9;font-weight:650}button:hover{filter:brightness(1.13)}button.alt{background:#1b2b22}button.warn{background:#643d27}button.small{padding:7px 10px;font-size:12px}input,textarea,select{width:100%;background:#101c16;color:#f1f0e4;border:1px solid #56725a;border-radius:9px;padding:11px}textarea{min-height:115px;resize:vertical}label{font-size:13px;color:#d2d5c6;display:block;margin:12px 0 5px}.shell{max-width:1150px;margin:auto;padding:16px}.head{display:flex;align-items:center;gap:12px;border-bottom:1px solid #455943;padding-bottom:14px}.head img{width:62px;height:62px;object-fit:contain;border-radius:12px}.muted{color:#a9b7a6;font-size:13px}.gold{color:#e1c782}h1{font-size:22px;margin:0}h2{font-size:20px;margin:8px 0 16px}h3{margin:6px 0 12px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.nav button{font-size:13px}.card{background:#1b2a20;border:1px solid #3f5945;border-radius:14px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.pill{border:1px solid #647e5e;padding:3px 9px;border-radius:99px;color:#e2cb91;font-size:12px}.map{position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,transparent,transparent 37px,#344f3b 38px),repeating-linear-gradient(90deg,#233b2b,#233b2b 37px,#344f3b 38px);border:2px solid #718263;border-radius:12px;height:360px;touch-action:manipulation}.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid #e4c477;border-radius:50%;width:38px;height:38px;padding:0;background:#253e30}.pin.locked{border-color:#9b8769;background:#53482d}.pin.done{border-color:#9ed1a5;background:#2e6442}.pin.hidden{display:none}.mapnote{position:absolute;bottom:8px;left:10px;background:#111b16dd;padding:5px 8px;border-radius:5px;font-size:11px}.notice{border-left:3px solid #e1c782;padding:10px;background:#2b3021;color:#e8dfbf}.qr{background:white;padding:10px;display:inline-block;border-radius:10px}.qr img{width:190px;height:190px;display:block}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.split{grid-template-columns:1fr}.shell{padding:11px}.head img{width:52px;height:52px}h1{font-size:18px}}.hidden{display:none!important}a{color:#d4bc7b}
</style></head><body><main class="shell"><header class="head"><img src="logo.jpg" alt="Escudo ANUBIS MAG"><div><div class="muted gold">ANUBIS MAG MILSIM</div><h1>MISSIONS <span class="gold">V1.0</span></h1><div class="muted">Centro de operaciones · prototipo local</div></div></header><div id="app"></div></main><script src="qr_slots.js"></script><script>
const KEY='anubis_missions_v1_data';const defaultData=()=>({adminPin:'',players:[],operations:[],missions:[],activeOp:'',lastSlot:0});let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaultData()}catch{db=defaultData()}let role='',playerId='',page='dashboard',editId='',selectedMission='',mapPlacement=false,scan=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), id=()=>Math.random().toString(36).slice(2,10), save=()=>localStorage.setItem(KEY,JSON.stringify(db)), op=()=>db.operations.find(o=>o.id===db.activeOp), player=()=>db.players.find(p=>p.id===playerId), missions=()=>db.missions.filter(m=>m.op===db.activeOp), getMission=i=>db.missions.find(m=>m.id===i), el=(tag,attrs={},text='')=>{let x=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));x.textContent=text;return x};
function render(){const a=$('#app');if(!db.adminPin){a.innerHTML=`<div class="card"><h2>Primera configuración</h2><p>Configura un PIN para entrar al panel de administración de este dispositivo.</p><div class="notice">Este PIN y los datos se guardan localmente: no es autenticación segura para uso multijugador real.</div><label>PIN administrador (mínimo 6 caracteres)</label><input id="newpin" type="password"><p><button onclick="setup()">Crear panel</button></p></div>`;return}if(!role){a.innerHTML=`<div class="grid"><div class="card"><h2>🛡️ Administrador</h2><label>PIN de administración</label><input id="apin" type="password"><p><button onclick="loginAdmin()">Entrar al centro de mando</button></p></div><div class="card"><h2>🎯 Jugador</h2><label>Código de jugador</label><input id="pcode" placeholder="ALFA-007"><label>Clave personal</label><input id="ppass" type="password"><p><button onclick="loginPlayer()">Acceder a misiones</button></p><p class="muted">El administrador crea primero las cuentas. El acceso QR personal se implementará con autenticación segura en la etapa multijugador.</p></div></div>`;return}let nav=role==='admin'?['dashboard','players','operations','missions','map','backup']:['my','map'];const labels={dashboard:'Inicio',players:'Jugadores',operations:'Guiones',missions:'Misiones',map:'Mapa',backup:'Respaldo',my:'Mis misiones'};a.innerHTML=`<div class="nav">${nav.map(n=>`<button class="${page===n?'':'alt'}" onclick="go('${n}')">${labels[n]}</button>`).join('')}<button class="warn" onclick="logout()">Salir</button></div><section id="view"></section>`;({dashboard:dashboard,players:playersView,operations:operationsView,missions:missionsView,map:mapView,backup:backupView,my:myView}[page]||dashboard)()}
function setup(){let p=$('#newpin').value;if(p.length<6)return alert('Usa al menos 6 caracteres');db.adminPin=p;save();render()}
function loginAdmin(){if($('#apin').value!==db.adminPin)return alert('PIN incorrecto');role='admin';page='dashboard';render()}
function loginPlayer(){let p=db.players.find(p=>p.code.trim().toUpperCase()===$('#pcode').value.trim().toUpperCase()&&p.pass===$('#ppass').value);if(!p)return alert('Credenciales incorrectas');role='player';playerId=p.id;page='my';render()}
function logout(){role='';playerId='';render()}function go(p){page=p;render()}
function dashboard(){$('#view').innerHTML=`<h2>Centro de mando</h2><div class="grid">${[['Jugadores',db.players.length],['Operaciones',db.operations.length],['Misiones',db.missions.length],['Objetivos completados',db.missions.filter(m=>m.done).length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><h1>${x[1]}</h1></div>`).join('')}</div><div class="card"><h3>Operación activa</h3><p>${op()?esc(op().name):'Sin operación seleccionada'}</p><div class="row"><button onclick="go('operations')">Crear guion</button><button class="alt" onclick="go('players')">Registrar jugadores</button><button class="alt" onclick="go('missions')">Crear misión</button></div></div><div class="notice">V1.0 local: los datos se guardan en este navegador. No hay sincronización entre celulares ni protección de secretos frente a quien tenga acceso al almacenamiento del dispositivo.</div>`}
function playersView(){$('#view').innerHTML=`<h2>Jugadores</h2><div class="card"><h3>Nuevo jugador</h3><div class="grid"><div><label>Nombre o indicativo</label><input id="pn" placeholder="Explorador 7"></div><div><label>Código</label><input id="pc" placeholder="ALFA-007"></div><div><label>Clave</label><input id="pw" placeholder="Clave individual"></div><div><label>Equipo</label><input id="pt" placeholder="ALFA"></div></div><p><button onclick="addPlayer()">Agregar jugador</button></p></div>${db.players.map(p=>`<div class="card row between"><div><b>${esc(p.name)}</b> <span class="pill">${esc(p.code)}</span><div class="muted">Equipo: ${esc(p.team)}</div></div><button class="small warn" onclick="removePlayer('${p.id}')">Eliminar</button></div>`).join('')||'<p class="muted">Todavía no hay jugadores.</p>'}`}
function addPlayer(){let name=$('#pn').value.trim(),code=$('#pc').value.trim(),pass=$('#pw').value,team=$('#pt').value.trim();if(!name||!code||!pass)return alert('Completa nombre, código y clave');if(db.players.some(p=>p.code.toLowerCase()===code.toLowerCase()))return alert('Código repetido');db.players.push({id:id(),name,code,pass,team});save();render()}
function removePlayer(i){if(!confirm('¿Eliminar jugador?'))return;db.players=db.players.filter(p=>p.id!==i);save();render()}
function operationsView(){$('#view').innerHTML=`<h2>Guiones y operaciones</h2><div class="card"><h3>Crear operación</h3><label>Nombre</label><input id="on" placeholder="OPERACIÓN FÉNIX"><label>Guion editable</label><textarea id="ot" placeholder="Historia, fases y reglas de la partida..."></textarea><label>Importar archivo de texto (.txt)</label><input type="file" id="otxt" accept=".txt,text/plain" onchange="importTxt(this)"><p class="muted">Word/PDF: en este prototipo puedes copiar su contenido y pegarlo en el editor. La extracción directa de DOCX/PDF está pendiente.</p><p><button onclick="addOperation()">Guardar operación</button></p></div>${db.operations.map(o=>`<div class="card"><div class="row between"><b>${esc(o.name)}</b><span class="pill">${db.activeOp===o.id?'ACTIVA':'GUARDADA'}</span></div><p class="muted">${esc(o.story.slice(0,180))}</p><div class="row"><button class="small" onclick="activateOp('${o.id}')">Activar</button><button class="small alt" onclick="editOperation('${o.id}')">Editar guion</button><button class="small warn" onclick="deleteOperation('${o.id}')">Eliminar</button></div></div>`).join('')}`}
function importTxt(input){let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{$('#ot').value=r.result};r.readAsText(f)}
function addOperation(){let name=$('#on').value.trim(),story=$('#ot').value.trim();if(!name)return alert('Escribe el nombre');let o={id:id(),name,story};db.operations.push(o);db.activeOp=o.id;save();render()}
function activateOp(i){db.activeOp=i;save();render()}
function editOperation(i){let o=db.operations.find(x=>x.id===i);if(!o)return;let name=prompt('Nombre de la operación',o.name);if(name===null)return;let story=prompt('Guion editable',o.story);if(story===null)return;o.name=name;o.story=story;save();render()}
function deleteOperation(i){if(!confirm('Se eliminará la operación y sus misiones. ¿Continuar?'))return;db.operations=db.operations.filter(o=>o.id!==i);db.missions=db.missions.filter(m=>m.op!==i);db.activeOp=db.operations[0]?.id||'';save();render()}
function missionsView(){if(!op()){$('#view').innerHTML='<h2>Misiones</h2><div class="notice">Primero crea una operación en Guiones.</div>';return}$('#view').innerHTML=`<h2>Misiones · ${esc(op().name)}</h2><div class="card"><h3>Nuevo objetivo</h3><div class="grid"><div><label>Título</label><input id="mt" placeholder="Recuperar documentos"></div><div><label>Asignar a</label><select id="mp"><option value="">Todos los jugadores</option>${db.players.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.code)})</option>`).join('')}</select></div><div><label>Visibilidad</label><select id="mv"><option value="visible">Visible</option><option value="locked">Desbloqueable</option><option value="secret">Secreta</option></select></div><div><label>Requiere completar antes</label><select id="md"><option value="">Ninguna</option>${missions().map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join('')}</select></div></div><label>Instrucciones</label><textarea id="mi" placeholder="Detalles del objetivo..."></textarea><p><button onclick="addMission()">Crear misión y QR</button></p></div>${missions().map(m=>`<div class="card"><div class="row between"><b>${esc(m.title)}</b><span class="pill">${m.visibility==='visible'?'Visible':m.visibility==='locked'?'Desbloqueable':'Secreta'}</span></div><p class="muted">${esc(m.instructions.slice(0,160))}</p><div class="muted">${m.player?esc(db.players.find(p=>p.id===m.player)?.name||'Jugador eliminado'):'Todos'} · ${m.done?'Completada':'Pendiente'} · ${m.x===null?'Sin marcador':'Con marcador'}</div><div class="row" style="margin-top:12px"><button class="small" onclick="showQR('${m.id}')">QR / código</button><button class="small alt" onclick="editMission('${m.id}')">Editar</button><button class="small alt" onclick="toggleDone('${m.id}')">${m.done?'Reabrir':'Aprobar cumplimiento'}</button><button class="small warn" onclick="deleteMission('${m.id}')">Eliminar</button></div></div>`).join('')||'<p class="muted">Sin misiones todavía.</p>'}<div id="qrpanel"></div>`}
function addMission(){let title=$('#mt').value.trim();if(!title)return alert('Escribe un título');if(db.lastSlot>=QR_SLOTS.length)return alert('Límite de 60 códigos QR en este prototipo');let m={id:id(),op:db.activeOp,title,instructions:$('#mi').value,player:$('#mp').value,visibility:$('#mv').value,depends:$('#md').value,done:false,revealed:false,x:null,y:null,slot:db.lastSlot++};db.missions.push(m);save();render()}
function editMission(i){let m=getMission(i);if(!m)return;let title=prompt('Título',m.title);if(title===null)return;let instructions=prompt('Instrucciones',m.instructions);if(instructions===null)return;m.title=title;m.instructions=instructions;save();render()}
function toggleDone(i){let m=getMission(i);m.done=!m.done;save();render()}
function deleteMission(i){if(!confirm('¿Eliminar misión?'))return;db.missions=db.missions.filter(m=>m.id!==i);save();render()}
function showQR(i){let m=getMission(i),s=QR_SLOTS[m.slot];$('#qrpanel').innerHTML=`<div class="card"><h3>QR del objetivo: ${esc(m.title)}</h3><div class="qr"><img src="${s.svg}" alt="QR del objetivo"></div><p><b>Código:</b> ${esc(s.code)}</p><p class="muted">Imprime el QR y colócalo en un punto autorizado del campo. El jugador podrá validar con el código incluso sin cámara.</p><button class="small alt" onclick="window.print()">Imprimir</button></div>`;$('#qrpanel').scrollIntoView({behavior:'smooth'})}
function allowed(m){return !m.player||m.player===playerId}function unlocked(m){return !m.depends||!!getMission(m.depends)?.done}function visible(m){if(!allowed(m))return false;if(m.visibility==='secret'&&!m.revealed)return false;return true}function available(m){return visible(m)&&unlocked(m)}
function myView(){let list=missions().filter(visible);$('#view').innerHTML=`<h2>Mis misiones</h2><p class="muted">${esc(player()?.name)} · ${esc(player()?.team)} · ${esc(op()?.name||'Sin operación activa')}</p>${list.map(m=>`<div class="card"><div class="row between"><b>${esc(m.title)}</b><span class="pill">${m.done?'Completada':!unlocked(m)?'Bloqueada':'Disponible'}</span></div><p>${available(m)?esc(m.instructions):'Completa el objetivo anterior para acceder a las instrucciones.'}</p>${available(m)&&!m.done?`<button class="small" onclick="validateCode('${m.id}')">Validar QR / código</button>`:''}</div>`).join('')||'<div class="notice">No hay misiones visibles para este jugador.</div>'}<div class="card"><h3>Validar código de un objetivo</h3><label>Código impreso en el QR</label><input id="anycode" placeholder="AM-XXXXXXXXXX"><p><button onclick="validateAny()">Comprobar código</button> <button class="alt" onclick="startScanner()">Escanear con cámara (si es compatible)</button></p><div id="scanarea"></div></div>`}
function validateCode(i){let code=prompt('Introduce el código del QR de este objetivo');if(code===null)return;checkCode(code,i)}function validateAny(){checkCode($('#anycode').value.trim())}
function checkCode(code,missionId){let m=missions().find(m=>QR_SLOTS[m.slot].code===code.trim().toUpperCase());if(!m)return alert('Código no válido para esta operación');if(missionId&&m.id!==missionId)return alert('El código corresponde a otro objetivo');if(!allowed(m)||!available(m))return alert('Este objetivo no está disponible para tu jugador');if(m.done)return alert('Este objetivo ya fue completado');m.done=true;save();alert('¡Objetivo validado y completado en este dispositivo!');render()}
async function startScanner(){let area=$('#scanarea');if(!('BarcodeDetector' in window)){area.textContent='Este navegador no ofrece lector QR integrado. Introduce el código manualmente.';return}if(!navigator.mediaDevices?.getUserMedia){area.textContent='Se requiere HTTPS y permiso de cámara.';return}try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.style.width='100%';area.replaceChildren(video);video.srcObject=stream;scan={stream,video,active:true};let detector=new BarcodeDetector({formats:['qr_code']});async function tick(){if(!scan?.active)return;try{let codes=await detector.detect(video);if(codes.length){let value=codes[0].rawValue;stopScanner();checkCode(value);return}}catch{}requestAnimationFrame(tick)}tick()}catch(e){area.textContent='No se pudo abrir la cámara: '+e.message}}
function stopScanner(){if(scan){scan.active=false;scan.stream.getTracks().forEach(t=>t.stop());scan=null}}
function mapView(){let list=missions().filter(m=>role==='admin'||visible(m));$('#view').innerHTML=`<h2>Plano táctico · ${esc(op()?.name||'Sin operación')}</h2><p class="muted">${role==='admin'?'Selecciona «Colocar objetivo» y toca el plano.':'Solo aparecen objetivos autorizados para tu jugador.'}</p><div id="map" class="map">${list.filter(m=>m.x!==null).map((m,i)=>`<button class="pin ${m.done?'done':!unlocked(m)?'locked':''}" style="left:${m.x}%;top:${m.y}%" onclick="mapPin('${m.id}')">${i+1}</button>`).join('')}<div class="mapnote">Plano esquemático · no GPS · posiciones relativas</div></div>${role==='admin'?`<div class="card"><label>Objetivo a colocar</label><select id="mapmission">${missions().map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join('')}</select><p><button onclick="beginPlacement()">Colocar objetivo en el plano</button> <button class="alt" onclick="uploadPlan()">Cargar imagen del terreno</button></p><input type="file" accept="image/*" id="planfile" style="display:none" onchange="loadPlan(this)"><p class="muted">La imagen se guarda en el navegador; utiliza archivos pequeños para evitar superar su capacidad.</p></div><div class="card"><h3>Revelar objetivos secretos</h3>${missions().filter(m=>m.visibility==='secret').map(m=>`<div class="row between"><span>${esc(m.title)}</span><button class="small" onclick="reveal('${m.id}')">${m.revealed?'Ocultar':'Revelar'}</button></div>`).join('')||'<p class="muted">No hay objetivos secretos.</p>'}</div>`:''}`;if(op()?.plan){$('#map').style.backgroundImage=`linear-gradient(#0a1a1155,#0a1a1155),url('${op().plan}')`;$('#map').style.backgroundSize='100% 100%'}$('#map').addEventListener('click',e=>{if(!mapPlacement||role!=='admin'||e.target.closest('.pin'))return;let r=e.currentTarget.getBoundingClientRect(),m=getMission($('#mapmission').value);if(!m)return;m.x=Math.max(3,Math.min(97,Math.round((e.clientX-r.left)/r.width*100)));m.y=Math.max(3,Math.min(97,Math.round((e.clientY-r.top)/r.height*100)));mapPlacement=false;save();render()})}
function mapPin(i){let m=getMission(i);if(role==='player'&&!available(m))return alert('Objetivo todavía bloqueado');alert(m.title+'\n'+(role==='admin'||available(m)?m.instructions:'Objetivo bloqueado'))}
function beginPlacement(){if(!$('#mapmission').value)return alert('Crea una misión primero');mapPlacement=true;alert('Ahora toca el lugar del plano donde quieres situar el objetivo.')}
function uploadPlan(){$('#planfile').click()}function loadPlan(input){let f=input.files[0];if(!f||!op())return;if(f.size>1500000)return alert('Utiliza una imagen menor de 1.5 MB');let r=new FileReader;r.onload=()=>{op().plan=r.result;try{save();render()}catch{alert('El navegador no tiene espacio suficiente para guardar la imagen')}};r.readAsDataURL(f)}
function reveal(i){let m=getMission(i);m.revealed=!m.revealed;save();render()}
function backupView(){$('#view').innerHTML=`<h2>Respaldo de partida</h2><div class="card"><p>Exporta tus datos como JSON y guárdalos fuera del navegador.</p><button onclick="exportData()">Descargar respaldo JSON</button><label>Importar respaldo JSON</label><input type="file" accept=".json,application/json" onchange="importData(this)"></div><div class="notice">Los respaldos contienen PIN, claves y misiones en texto legible. No los compartas con jugadores. Esta función no sustituye un servidor seguro.</div>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ANUBIS_MISSIONS_respaldo.json';a.click();URL.revokeObjectURL(u)}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.players)||!Array.isArray(d.operations)||!Array.isArray(d.missions)||typeof d.adminPin!=='string')throw Error('Formato no válido');if(!confirm('Se reemplazarán todos los datos locales. ¿Continuar?'))return;db=d;save();logout()}catch(e){alert('No se pudo importar: '+e.message)}};r.readAsText(f)}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
